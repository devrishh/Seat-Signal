<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#FFFFFF" />
  <script>try{var t=JSON.parse(localStorage.getItem("ss-theme"));document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Seat Signal: a Delhi bus journey planner that shows how crowded each bus is likely to be, from October 2026 e-ticket data." />
  <title>Seat Signal · Know the crowd before you board</title>
  <link rel="preload" href="/fonts/hanken-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/hanken-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo-512.png" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#1C4F9C"/><rect x="9" y="27" width="6" height="10" rx="2" fill="#FFFFFF" fill-opacity=".35"/><rect x="18" y="19" width="6" height="18" rx="2" fill="#FFFFFF" fill-opacity=".65"/><path d="M27 12.6c0-1.4 1.2-2.4 2.6-2.2l2 .3c1.1.2 1.9 1.1 1.9 2.2V25H38c1.7 0 3 1.3 3 3s-1.3 3-3 3H29a2 2 0 0 1-2-2z" fill="#FFFFFF"/><path d="M29.5 31v5M37 31v5" stroke="#C9D8EE" stroke-width="2.6" stroke-linecap="round"/></symbol></svg>

  <div class="site">
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="#/" style="text-decoration:none;color:inherit"><svg class="mark" aria-hidden="true"><use href="#logo"/></svg><span>Seat Signal</span></a>
        <nav class="nav" aria-label="Main">
          <a href="#/" data-nav="home">Home</a>
          <a href="#/plan" data-nav="plan">Plan a trip</a>
          <a href="#/best" data-nav="best">Best time</a>
          <a href="#/routes" data-nav="routes">Routes</a>
          <a href="#/stops" data-nav="stops">Stops</a>
          <a href="#/about" data-nav="about">How we know</a>
        </nav>
        <div class="top-tools">
        <button class="icon-btn guide-btn" id="guide-btn" type="button" aria-label="Show me around" title="Show me around" data-tour>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle class="dot" cx="12" cy="17" r="0.6"/></svg>
        </button>
        <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Switch to night mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="moon-cut"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="cut" cx="17" cy="7" r="6.5" fill="#000"/></mask></defs>
            <circle class="core" cx="12" cy="12" r="8" mask="url(#moon-cut)"/>
            <g class="rays"><path d="M12 1.8v2.4M12 19.8v2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g></svg>
        </button>
        </div>
        <button class="when" id="when" aria-label="Change day and time">
          <span class="live-dot" id="when-dot"></span>
          <span><span class="when-tag" id="when-tag">Live</span> · <span id="when-label">—</span></span>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/plan" data-nav="plan"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></svg><span>Plan</span></a>
      <a href="#/routes" data-nav="routes"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="2"/><path d="M5 11h14M8 21l1-4M16 21l-1-4"/></svg><span>Routes</span></a>
      <a href="#/stops" data-nav="stops"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span>Stops</span></a>
    </nav>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="dialog" id="dialog-when" role="dialog" aria-modal="true" aria-labelledby="when-title">
    <h3 class="t-heading" id="when-title">When are you travelling?</h3>
    <p class="t-small muted">Seat Signal follows the current time by default. Choose another day or time to plan ahead.</p>
    <p class="t-small-strong label">Day</p>
    <div class="segmented" id="seg-day"><button data-v="weekday">Weekday</button><button data-v="saturday">Saturday</button><button data-v="sunday">Sunday or holiday</button></div>
    <p class="t-small-strong label">Leaving at</p>
    <p class="t-display tnum" id="time-big">9:00 am</p>
    <input type="range" id="time-range" min="300" max="1410" step="15" aria-label="Departure time" />
    <div class="axis t-caption"><span>5 am</span><span>11 am</span><span>5 pm</span><span>11 pm</span></div>
    <div class="dialog-actions"><button class="btn secondary" id="when-cancel">Cancel</button><button class="btn primary" id="when-done">Use this time</button></div>
    <button class="btn quiet t-small-strong" id="when-live">Go back to live time</button>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
